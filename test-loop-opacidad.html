<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test loop opacidad — SVG + PNG</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: #18063a;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .stage {
    position: relative;
    width: min(1100px, 92vw);
    height: min(650px, 82vh);
    border-radius: 28px;
    overflow: hidden;
    background:
      radial-gradient(circle at 72% 30%, rgba(13,196,184,.20), transparent 34%),
      radial-gradient(circle at 28% 72%, rgba(255,121,45,.18), transparent 36%),
      linear-gradient(135deg, #21064d 0%, #4a0b72 48%, #170334 100%);
  }
  .symbol {
    position: absolute;
    width: 120px;
    height: 120px;
    object-fit: contain;
    opacity: .14;
    animation: pulse 2.6s ease-in-out infinite;
    will-change: opacity;
  }
  .s1 { left: 10%; top: 16%; animation-delay: 0s; }
  .s2 { left: 33%; top: 58%; animation-delay: -.65s; }
  .s3 { right: 26%; top: 20%; animation-delay: -1.3s; }
  .s4 { right: 8%; bottom: 12%; animation-delay: -1.95s; }

  @keyframes pulse {
    0%, 100% { opacity: .12; }
    50% { opacity: 1; }
  }

  .caption {
    position: absolute;
    left: 30px;
    bottom: 24px;
    font-size: 14px;
    opacity: .7;
  }
</style>
</head>
